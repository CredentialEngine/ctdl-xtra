[project]
name = "xtra-mockup"
version = "0.1.0"
description = "University of Arkansas catalog courses as CTDL, with evidence for every value. Never published."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "html5lib>=1.1",
    "httpx>=0.27",
]

[project.scripts]
xtra = "xtra.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xtra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
