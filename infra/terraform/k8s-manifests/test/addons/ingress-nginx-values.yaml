controller:
  # TEST runs on a single consolidated node group (nodepool: app), no HA.
  # Two replicas anyway: the chart's PDB (minAvailable: 1) blocks node drains
  # when only one replica runs.
  replicaCount: 2
  nodeSelector:
    nodepool: app
  service:
    externalTrafficPolicy: Local
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: nlb
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
