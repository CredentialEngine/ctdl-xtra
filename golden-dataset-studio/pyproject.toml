[project]
name = "golden-dataset-studio"
version = "0.1.0"
description = "CTDL Golden Rules Studio: rule-centric review that builds golden datasets of CTDL Courses"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "lxml>=5.0",
  "cssselect>=1.2",
  "beautifulsoup4>=4.12",
  "pyarrow>=17",
  "duckdb>=1.1",
  "httpx>=0.27",
  "azure-storage-blob>=12.19",
  "xtra-cli",  # xtra's scorer, called in-process (Evals spec §3.3)
]

[tool.uv.sources]
xtra-cli = { path = "../xtra-cli", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
golden-datasets = "golden_datasets.cli:main"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/golden_datasets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: end-to-end tests on real catalog data from the local mirror",
  "azure: tests that need Azurite or the Azure scratch prefix",
]
addopts = "-m 'not slow and not azure'"

[tool.ruff]
line-length = 110
src = ["src"]
exclude = ["docs"]

[tool.ruff.lint]
# N: names (CamelCase classes, lowercase functions and variables); C901 / PLR0912 / PLR0915: a coarse guard on long or
# tangled functions. The line limit itself (15 per function) is tests/test_function_length.py, which ruff can't count.
select = ["E", "F", "W", "I", "B", "UP", "N", "C901", "PLR0912", "PLR0915"]
ignore = ["E501", "B905", "N818"]  # N818: the exception names (K2Full, LockBusy...) are fine as they are

[tool.ruff.lint.pylint]
max-statements = 15
max-branches = 8

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N806", "C901", "PLR0912", "PLR0915"]  # the style rules are for the Studio's code; tests name constants they bind locally (B, LOADER) like constants
"src/golden_datasets/v2engine.py" = ["C901", "PLR0912", "PLR0915"]  # the v2 engine, kept as it was for the equivalence test
