# xtra-cli release pipeline

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - xtra-cli/**
    exclude:
      - xtra-cli/xtra-cli-ci.yaml
      - xtra-cli/xtra-cli-release.yaml

pr: none

pool:
  vmImage: "ubuntu-latest"

variables:
  pythonVersion: "3.14"
  imageRepository: "ce/xtra-cli"
  imageTag: "$(VersionNumber)"
  acrName: "cetestimages.azurecr.io"
  deploymentPipelineName: "Deployment-ImageTag-Update"
  VersionNumber: $[format('{0:yyyy}.{0:MM}.{0:dd}.{1}', pipeline.startTime, variables['Build.BuildId'])]

jobs:
  - job: Build_Test
    displayName: "Build & Test"
    steps:
      - checkout: self
        fetchDepth: 1

      - task: PowerShell@2
        displayName: "Set Build Number"
        inputs:
          targetType: inline
          pwsh: true
          script: |
            Write-Host "##vso[build.updatebuildnumber]$(VersionNumber)"

      # src/ (src/lib/ included) and the xtra_cli.py shim ship in the image.
      - bash: |
          set -euo pipefail
          docker run --rm \
            -v "$(Build.SourcesDirectory)/xtra-cli:/src" \
            -w /src \
            semgrep/semgrep semgrep scan \
              --verbose \
              --error \
              --config "p/secrets" \
              --config "p/security-audit" \
              --config "p/python" \
              --config "p/dockerfile" \
              src tests xtra_cli.py Dockerfile
        displayName: "Semgrep scan - xtra-cli"

      - task: UsePythonVersion@0
        displayName: "Use Python $(pythonVersion)"
        inputs:
          versionSpec: "$(pythonVersion)"
          addToPath: true

      # The azure extra is optional at runtime, but the Blob tests skip
      # without it.
      - bash: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev,azure]"
        displayName: "Install dependencies"
        workingDirectory: "$(Build.SourcesDirectory)/xtra-cli"

      - bash: |
          set -euo pipefail
          ruff check .
          ruff format . --check
        displayName: "Lint and format check"
        workingDirectory: "$(Build.SourcesDirectory)/xtra-cli"

      - bash: |
          set -euo pipefail
          pytest \
            -m "not integration" \
            --tb=short \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-fail-under=80
        displayName: "Run unit tests"
        workingDirectory: "$(Build.SourcesDirectory)/xtra-cli"

      # Unlike ceops, no wheel is built or published: src/lib/ is not a package,
      # so the wheel cannot start the CLI. The image installs from the source
      # tree.
      - task: PublishPipelineArtifact@1
        displayName: "Publish coverage report"
        condition: always()
        inputs:
          targetPath: "$(Build.SourcesDirectory)/xtra-cli/htmlcov"
          artifact: "xtra-cli-coverage-html"
          publishLocation: "pipeline"

  - job: Docker_Build
    displayName: "Build Docker Image"
    dependsOn: Build_Test
    condition: succeeded()
    steps:
      - checkout: self
        fetchDepth: 1

      # `xtra --version` reads _generated_version.py before the package
      # metadata, and a checkout never has the file. pyproject.toml gets the
      # PEP 440 form of the version, without the leading zeros.
      - bash: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          release_version = os.environ["RELEASE_VERSION"]
          package_version = ".".join(
              str(int(part)) for part in release_version.split(".")
          )

          pyproject_path = Path("pyproject.toml")
          pyproject, stamped = re.subn(
              r'^version = "[^"]*"',
              f'version = "{package_version}"',
              pyproject_path.read_text(),
              count=1,
              flags=re.MULTILINE,
          )
          if stamped != 1:
              raise SystemExit("pyproject.toml has no version line to stamp")
          pyproject_path.write_text(pyproject)

          Path("src/xtra/_generated_version.py").write_text(
              f'VERSION = "{release_version}"\n'
          )
          PY
        displayName: "Stamp release version"
        workingDirectory: "$(Build.SourcesDirectory)/xtra-cli"
        env:
          RELEASE_VERSION: $(VersionNumber)

      - task: Docker@2
        displayName: "Login to ACR"
        inputs:
          command: login
          containerRegistry: "$(acrName)"

      - task: Docker@2
        displayName: "Build Docker Image $(imageRepository)"
        inputs:
          command: build
          Dockerfile: "$(Build.SourcesDirectory)/xtra-cli/Dockerfile"
          buildContext: "$(Build.SourcesDirectory)/xtra-cli"
          repository: "$(imageRepository)"
          tags: |
            $(imageTag)
            latest

      - task: Docker@2
        displayName: "Push Docker Image to ACR"
        inputs:
          command: push
          containerRegistry: "$(acrName)"
          repository: "$(imageRepository)"
          tags: |
            $(imageTag)
            latest

  - job: TriggerDeployment
    displayName: "Trigger xtra-cli Deployment"
    dependsOn: Docker_Build
    condition: succeeded()
    steps:
      - checkout: none

      - task: PowerShell@2
        displayName: "Trigger xtra-cli task-image update"
        env:
          AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
        inputs:
          targetType: inline
          pwsh: true
          script: |
            $ErrorActionPreference = 'Stop'

            echo "$env:AZURE_DEVOPS_EXT_PAT" | az devops login --debug

            $result = az pipelines run `
              --organization "https://dev.azure.com/Credential-Engine/" `
              --project "CredentialEngine" `
              --name "$(deploymentPipelineName)" `
              --branch main `
              --parameters imageTag=$(imageTag) imageName=$(imageRepository) `
              --debug

            Write-Host "Pipeline run command completed. Result:"
            Write-Host $result
            Write-Host "Triggered $(deploymentPipelineName) for $(imageRepository):$(imageTag)."
