name: Build Base Image

# Manual runs from main build base.Dockerfile on xtra-backup. Pushes of that
# file are built by the copy of this workflow on xtra-backup.
on:
  push:
    branches: [xtra-backup]
    paths:
      - base.Dockerfile
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 996810415034.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: ctdl-xtra-test/base

jobs:
  build:
    name: Build & Push Base Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: xtra-backup

      - name: Checked out revision
        id: rev
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: base.Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:sha-${{ steps.rev.outputs.sha }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Summary
        run: echo "### Built base image \`sha-${{ steps.rev.outputs.sha }}\` from xtra-backup" >> "$GITHUB_STEP_SUMMARY"
