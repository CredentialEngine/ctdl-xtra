[project]
name = "review-ui-v2"
version = "0.1.0"
description = "Local review UI for declarative CTDL Course extraction rules (CCSF / CurricUNET)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "jsonschema>=4.20",
  "cssselect>=1.2",
]

[project.optional-dependencies]
azure = ["azure-storage-blob>=12.19", "azure-identity>=1.15"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
review-ui-v2 = "review_ui.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["server"]

[tool.ruff]
line-length = 88
src = ["server"]
